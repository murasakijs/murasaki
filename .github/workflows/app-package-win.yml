name: App package smoke test (Windows)

# Verifies the Windows packaging path end-to-end (murasaki build → murasaki
# bundle --target win32-<arch> → packaged .exe actually runs) using the native
# addon + murasaki-launcher freshly built from THIS branch — the published
# @murasakijs/native@0.31.0 only ships the old macOS-only stub launcher (see
# crates/native/src/launcher.rs), so testing against it would miss the whole
# point of this workflow. Also builds and verifies the NSIS `-setup-<arch>.exe` +
# WiX `.msi` installers (murasaki installer --target win32-<arch>, Phase 2 of
# Windows packaging — see packages/murasaki/src/cli/installer.ts's win32
# path), which only run for real on Windows (WiX in particular is
# Windows-only), so this workflow is their only pre-merge verification.
# Finally, end-to-end verifies the Windows auto-updater apply mechanism
# (Phase 3, updater contract §8 — see .github/scripts/win-updater-e2e.ps1's
# header comment) against a real installed app, by invoking the installed
# launcher's `--apply-update` mode directly: sha256 gate, wait-pid gate,
# self-copy + re-exec, silent NSIS install, marker-verified swap. Directly
# (not through the app's webview + injected appQuit) because WebView2 can't
# initialize on a headless CI runner (0x80070578); the §7 handoff/appQuit
# trigger and the Windows Job Object survival need the GUI and are covered by
# code review instead.
#
# Runs the whole pipeline once per supported win32 arch via a matrix — x64
# and arm64 (ia32/x86 isn't a supported target) — each on a runner that's
# native for that arch: windows-latest (x86_64) and windows-11-arm (a
# GitHub-hosted native ARM64 runner, free for public repos). Both legs are
# therefore genuine native builds rather than cross-compiles, so every Rust/
# napi build step below can keep relying on host-arch auto-detection exactly
# like the original single-arch job did.
#
on:
  pull_request:
    paths:
      - '.github/scripts/win-*.ps1'
      - '.github/workflows/app-package-win.yml'
      - 'crates/native/**'
      - 'packages/murasaki/**'
      - 'packages/create-murasaki/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/win-*.ps1'
      - '.github/workflows/app-package-win.yml'
      - 'crates/native/**'
      - 'packages/murasaki/**'
      - 'packages/create-murasaki/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rustTarget: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rustTarget: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    name: win-smoke (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # No version pin: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 reads it from the root
      # package.json "packageManager" field (specifying both errors).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Both matrix runners are native for their arch (windows-latest is
      # x86_64, windows-11-arm is aarch64) — no cross-target flag is needed
      # on any Rust build step below (unlike native-release.yml's
      # cross-target matrix entries); `targets:` here just makes sure the
      # matching target is installed on top of whatever "stable" already
      # defaults to on each host.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rustTarget }}

      # Cache the cargo registry + target dir so the ~700 dependency crates
      # (the multi-minute bottleneck) compile only on the first run; on later
      # pushes only our own crate recompiles, cutting the job from ~9m to a
      # few. Keys per-runner (and therefore per-arch) automatically, so the
      # two matrix legs never share (or clobber) each other's cache.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/native

      # Scaffolds a throwaway app from the default template *inside* the
      # pnpm workspace (examples/ is a pnpm-workspace.yaml glob) before the
      # one-and-only `pnpm install` below, so its `murasaki` / `@murasakijs/ui`
      # dependencies resolve to workspace symlinks pointing at this branch's
      # code — a plain `pnpm create murasaki` (or installing the template
      # standalone) would instead pull the published packages from npm,
      # defeating the point of this workflow.
      - name: Scaffold test app from the default template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/win-smoke-app
          cp -r packages/create-murasaki/templates/default/. examples/win-smoke-app/
          cp packages/create-murasaki/templates/default/gitignore.tpl examples/win-smoke-app/.gitignore
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('examples/win-smoke-app/package.json', 'utf8'));
            p.name = 'win-smoke-app';
            p.dependencies.murasaki = 'workspace:*';
            p.dependencies['@murasakijs/ui'] = 'workspace:*';
            fs.writeFileSync('examples/win-smoke-app/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: pnpm install
        run: pnpm install --no-frozen-lockfile

      # @murasakijs/ui must build first: murasaki now imports its TitleBar/
      # Menubar (for the built-in custom title bar), and murasaki's tsc build
      # resolves @murasakijs/ui via its dist/index.d.ts — which won't exist on
      # a fresh CI checkout until this step runs.
      - name: Build @murasakijs/ui
        run: pnpm --filter @murasakijs/ui build

      - name: Build murasaki
        run: pnpm --filter murasaki build

      # Rebuild the native addon (.node) for this branch — see this
      # workflow's top comment on why the published one can't be used.
      - name: Build @murasakijs/native native addon
        working-directory: crates/native
        run: pnpm exec napi build --platform --release

      # Rebuild murasaki-launcher for this branch. Deliberately no --target:
      # bundle.ts's resolveLauncherBinary falls back to this exact
      # `target/release/murasaki-launcher.exe` (host-arch build) when the
      # bundle target matches the host, which it does on both matrix legs
      # (win32-x64 on windows-latest, win32-arm64 on windows-11-arm) — see
      # that function's doc comment in packages/murasaki/src/cli/bundle.ts.
      - name: Build murasaki-launcher
        working-directory: crates/native
        run: cargo build --release --bin murasaki-launcher

      - name: murasaki build (test app)
        working-directory: examples/win-smoke-app
        run: pnpm exec murasaki build

      - name: murasaki bundle --target win32-${{ matrix.arch }} (test app)
        working-directory: examples/win-smoke-app
        run: pnpm exec murasaki bundle --target win32-${{ matrix.arch }}

      - name: Locate packaged .exe
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path examples/win-smoke-app/dist/bundle -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error 'No .exe found under examples/win-smoke-app/dist/bundle'
            exit 1
          }
          Write-Host "Found: $($exe.FullName)"
          "exePath=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Launches the packaged app and polls prod-server.mjs's HTTP endpoint
      # for a 200 (see .github/scripts/win-smoke-test.ps1's doc comment for
      # exactly what this does and doesn't assert — briefly: it confirms
      # node.exe spawned and served a request, and that the launcher process
      # is still alive a couple seconds after — not full WebView2 rendering
      # correctness, which needs manual/visual verification).
      - name: Smoke test packaged app
        shell: pwsh
        run: .github/scripts/win-smoke-test.ps1 -ExePath "${{ steps.locate.outputs.exePath }}" -TimeoutSeconds 60

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: win32-bundle-${{ matrix.arch }}
          path: examples/win-smoke-app/dist/bundle/**
          if-no-files-found: warn

      # ── Phase 2: installer toolchains + build/verify ───────────────────

      # choco itself + makensis both run under Windows-on-ARM's built-in x86
      # emulation on the windows-11-arm runner (choco has no native arm64
      # NSIS package) — expected to work transparently, but marked
      # non-fatal on the arm64 leg in case that emulation path turns out to
      # be unavailable on this particular runner image. installer.ts's
      # buildNsisInstaller already degrades gracefully (warns + skips) if
      # makensis never lands on PATH, so a failure here just means this
      # leg's NSIS installer is skipped rather than the whole arm64 job
      # going red.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          # choco doesn't always shim makensis onto PATH; add its dir so
          # installer.ts's `makensis -VERSION` detection finds it.
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      # WiX is a .NET global tool, so it runs natively on arm64 — expected to
      # work unmodified there too, but marked non-fatal on that leg for the
      # same reason as the NSIS step above.
      - name: Install WiX v4
        shell: pwsh
        run: |
          # Pin to v4 (not the latest v7) — WiX v6+ gates `wix build` behind the
          # Open Source Maintenance Fee EULA (error WIX7015), and installer.ts's
          # generated .wxs targets the v4 toolset. v4 is MIT with no fee.
          dotnet tool install --global wix --version 4.0.6
          # `dotnet tool --global` drops wix.exe under %USERPROFILE%\.dotnet\tools,
          # which isn't on PATH by default — add it so `wix --version` resolves.
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      # The MSI's WixUI wizard (Round 2 — see wxsScript's doc comment in
      # installer.ts) needs WixToolset.UI.wixext fetched into the extension
      # cache before `wix build -ext WixToolset.UI.wixext` can resolve it;
      # pinned to the extension's 4.0.6 release to match the pinned v4 core
      # above (an unpinned `add` grabs the latest — v7 — which isn't
      # compatible with the v4 core toolset). Same non-fatal-on-arm64
      # posture as the "Install WiX v4" step above.
      - name: Install WiX UI extension
        shell: pwsh
        run: wix extension add -g WixToolset.UI.wixext/4.0.6

      - name: murasaki installer --target win32-${{ matrix.arch }} (test app)
        working-directory: examples/win-smoke-app
        # --no-build: reuse the bundle produced by the earlier `murasaki
        # bundle --target win32-<arch>` step above rather than re-bundling
        # (this is also what exercises the win32 installer path's own
        # re-bundle skip logic — see installer.ts's installerWin32). Note
        # this step itself can't fail from a missing makensis/wix — both are
        # optional local tools that installer.ts detects and skips
        # individually (warn + skip), see installer.ts's installerWin32 doc
        # comment.
        run: pnpm exec murasaki installer --target win32-${{ matrix.arch }} --no-build

      # Locates whichever installer artifacts got produced. The portable zip
      # has no external tool dependency, so it's always mandatory. The NSIS
      # -setup-<arch>.exe/.msi are mandatory on the x64 leg (both toolchains always
      # install cleanly there) but best-effort on the arm64 leg: if the
      # Install NSIS/WiX steps above degraded (see their comments), murasaki
      # installer already warned + skipped that installer type rather than
      # throwing, so its absence here is expected — reported as a warning,
      # not a failure.
      - name: Locate installer artifacts
        id: locate-installers
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path examples/win-smoke-app/dist/bundle -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Write-Error 'No portable .zip found under examples/win-smoke-app/dist/bundle'; exit 1 }
          Write-Host "zip: $($zip.FullName) ($($zip.Length) bytes)"
          "zipPath=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $setup = Get-ChildItem -Path examples/win-smoke-app/dist -Filter *-setup-*.exe | Select-Object -First 1
          if ($setup) {
            Write-Host "setup exe: $($setup.FullName) ($($setup.Length) bytes)"
            "setupPath=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Error 'No NSIS -setup-<arch>.exe found under examples/win-smoke-app/dist'
            exit 1
          }

          $msi = Get-ChildItem -Path examples/win-smoke-app/dist -Filter *.msi | Select-Object -First 1
          if ($msi) {
            Write-Host "msi: $($msi.FullName) ($($msi.Length) bytes)"
            "msiPath=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Error 'No .msi found under examples/win-smoke-app/dist (WiX build likely failed)'
            exit 1
          }

      # Asserts whichever installers were produced above are well-formed by
      # checking their magic bytes rather than trusting the file extension —
      # cheap and doesn't need msiexec/admin rights: the setup exe must be a PE
      # (MZ magic), .msi must be an OLE Compound File (the container format
      # Windows Installer uses). WiX/makensis already exited non-zero on a
      # real build failure (installer.ts throws/warns and the previous
      # step's file search would come up empty), so this step is mainly a
      # sanity check on top of that. Each check is skipped (rather than
      # failed) when its path output is empty — only possible on the arm64
      # leg, when the corresponding tool was unavailable (see the previous
      # step).
      - name: Verify installers are well-formed
        shell: pwsh
        run: |
          $setupPath = "${{ steps.locate-installers.outputs.setupPath }}"
          if ($setupPath) {
            $setupBytes = [System.IO.File]::ReadAllBytes($setupPath)
            if ($setupBytes.Length -lt 2 -or $setupBytes[0] -ne 0x4D -or $setupBytes[1] -ne 0x5A) {
              Write-Error 'setup exe does not start with the MZ (PE) magic'
              exit 1
            }
            Write-Host 'setup exe is well-formed.'
          }

          $msiPath = "${{ steps.locate-installers.outputs.msiPath }}"
          if ($msiPath) {
            $msiBytes = [System.IO.File]::ReadAllBytes($msiPath)
            $msiMagic = [byte[]](0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1)
            if (Compare-Object $msiBytes[0..7] $msiMagic) {
              Write-Error '.msi does not start with the OLE Compound File magic'
              exit 1
            }
            Write-Host '.msi is well-formed.'
          }

      # Bonus verification: actually run the NSIS installer silently (per-user
      # default install mode needs no admin/UAC prompt, so this works
      # unattended in CI), confirm it landed under %LOCALAPPDATA%\Programs,
      # then reuse the same smoke test the portable bundle got above. Marked
      # `continue-on-error` per this workflow's spec — the mandatory checks
      # above already assert the installers themselves are real, so a flaky
      # silent-install/launch here shouldn't fail the whole job. Skipped
      # entirely if the setup exe wasn't produced (only possible on the arm64
      # leg — see "Locate installer artifacts" above).
      - name: Silent-install the NSIS installer and smoke test
        id: silent-install
        if: steps.locate-installers.outputs.setupPath != ''
        shell: pwsh
        run: |
          $setup = "${{ steps.locate-installers.outputs.setupPath }}"
          Write-Host "Silent-installing $setup ..."
          $proc = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Error "Silent install exited with code $($proc.ExitCode)"
            exit 1
          }

          $installedExe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne 'Uninstall.exe' } |
            Select-Object -First 1
          if (-not $installedExe) {
            Write-Error "Silent install did not produce an .exe under $env:LOCALAPPDATA\Programs"
            exit 1
          }
          Write-Host "Installed exe: $($installedExe.FullName)"

          .github/scripts/win-smoke-test.ps1 -ExePath $installedExe.FullName -TimeoutSeconds 60

      # ── Phase 3: Windows auto-updater end-to-end (updater contract §8) ────
      #
      # Verifies the Windows apply mechanism against a real installed app by
      # invoking the installed launcher's `--apply-update` mode directly:
      # sha256 gate, wait-pid gate, the self-copy + re-exec-outside-target
      # hop, the silent NSIS install, and a marker-based proof of the swap.
      # Invoked directly (not through the app's webview + an injected
      # `appQuit`) because WebView2 cannot initialize on a headless /
      # session-0 CI runner (0x80070578) — the direct call reaches the exact
      # same Rust apply code with the exact same argv `maybe_spawn_apply_helper`
      # would build. Note this covers §8 (the apply itself); the §7
      # `.murasaki-apply.json` handoff read + `appQuit` trigger, and the
      # Windows Job Object survival, need the GUI and are covered by code
      # review (see win_job / maybe_spawn_apply_helper in launcher.rs). This
      # apply path was also verified end-to-end on real Windows hardware. See
      # .github/scripts/win-updater-e2e.ps1's header comment for the full story
      # and its assertions in order.
      #
      # Needs a real NSIS `-setup-<arch>.exe`, so it's gated on the same
      # `setupPath` output as the bonus silent-install smoke test above —
      # but unlike that step, this one is NOT continue-on-error: a failure
      # here is the actual regression this workflow exists to catch, not a
      # flaky CI hiccup.
      #
      # Produces a "v2" build of the same test app — same version (this
      # doesn't bump anything; the updater only cares about the payload +
      # its sha256, not the version number, for this test) but with one
      # extra marker file baked into resources\, so the E2E script can tell
      # "v2 was actually applied" apart from "v1 is still installed"
      # without v1 ever shipping it.
      - name: Copy the v1 installer aside (updater E2E)
        id: copy-v1
        if: steps.locate-installers.outputs.setupPath != ''
        shell: pwsh
        run: |
          $v1 = "${{ steps.locate-installers.outputs.setupPath }}"
          $dest = Join-Path $env:RUNNER_TEMP 'murasaki-updater-e2e-v1-setup.exe'
          Copy-Item -Path $v1 -Destination $dest -Force
          Write-Host "v1 installer copied aside: $dest"
          "setupV1Path=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # productName is derived from the already-located bundle .exe's base
      # name (steps.locate.outputs.exePath, from earlier in this job) rather
      # than hardcoded — bundleWin32 always names it `<productName>.exe` at
      # the bundle root (see bundle.ts), so this stays correct even if the
      # scaffolded template's productName ever changes.
      - name: Bake a v2 marker into the staged bundle (updater E2E)
        id: build-v2
        if: steps.locate-installers.outputs.setupPath != ''
        shell: pwsh
        run: |
          $productName = [System.IO.Path]::GetFileNameWithoutExtension("${{ steps.locate.outputs.exePath }}")
          $bundleDir = "examples/win-smoke-app/dist/bundle/$productName"
          $resourcesDir = Join-Path $bundleDir 'resources'
          if (-not (Test-Path $resourcesDir)) {
            Write-Error "expected bundle resources dir not found: $resourcesDir"
            exit 1
          }
          $markerPath = Join-Path $resourcesDir '.murasaki-e2e-marker'
          Set-Content -Path $markerPath -Value 'murasaki updater E2E v2 marker' -NoNewline
          if (-not (Test-Path $markerPath)) {
            Write-Error "failed to write marker file: $markerPath"
            exit 1
          }
          Write-Host "Marker written: $markerPath"
          "productName=$productName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: murasaki installer --target win32-${{ matrix.arch }} (v2, --no-build)
        if: steps.locate-installers.outputs.setupPath != ''
        working-directory: examples/win-smoke-app
        # Re-runs against the SAME staged bundle (now containing the marker
        # file from the previous step) with --no-build, so this overwrites
        # the exact same dist/<productName>-<version>-setup-<arch>.exe path
        # steps.locate-installers.outputs.setupPath already points at —
        # that path now holds "v2"; steps.copy-v1's copy (above) is "v1".
        run: pnpm exec murasaki installer --target win32-${{ matrix.arch }} --no-build

      - name: Windows updater E2E (headless --apply-update — apply mechanism, contract §8)
        if: steps.locate-installers.outputs.setupPath != ''
        timeout-minutes: 10
        shell: pwsh
        run: |
          .github/scripts/win-updater-e2e.ps1 `
            -ProductName "${{ steps.build-v2.outputs.productName }}" `
            -SetupV1 "${{ steps.copy-v1.outputs.setupV1Path }}" `
            -SetupV2 "${{ steps.locate-installers.outputs.setupPath }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: win32-updater-e2e-log-${{ matrix.arch }}
          path: ${{ runner.temp }}/murasaki-updater-e2e.log
          if-no-files-found: warn

      # Full set: both installers + the portable zip (whichever exist).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: win32-installers-${{ matrix.arch }}
          path: |
            examples/win-smoke-app/dist/*-setup-*.exe
            examples/win-smoke-app/dist/*.msi
            examples/win-smoke-app/dist/bundle/*.zip
          if-no-files-found: warn

      # Lean artifact: just the two installers, for a quick download while
      # iterating on Windows behavior (skips the ~200MB raw bundle + portable zip).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: win32-setup-msi-${{ matrix.arch }}
          path: |
            examples/win-smoke-app/dist/*-setup-*.exe
            examples/win-smoke-app/dist/*.msi
          if-no-files-found: warn
