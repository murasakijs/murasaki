name: App package smoke test (macOS)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/mac-*.sh'
      - '.github/workflows/app-package-mac.yml'
      - 'crates/native/**'
      - 'packages/murasaki/**'
      - 'packages/create-murasaki/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/mac-*.sh'
      - '.github/workflows/app-package-mac.yml'
      - 'crates/native/**'
      - 'packages/murasaki/**'
      - 'packages/create-murasaki/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: app-package-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    name: macOS ${{ matrix.arch }} / DMG, update, rollback gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      NODE_VERSION: '22.12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/native
          key: mac-package-${{ matrix.arch }}

      - name: Add the package probe app to the workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/mac-package-app
          cp -R packages/create-murasaki/templates/default/. examples/mac-package-app/
          node <<'NODE'
          const fs = require('node:fs')
          const manifestPath = 'examples/mac-package-app/package.json'
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          manifest.name = 'mac-package-app'
          manifest.dependencies.murasaki = 'workspace:*'
          manifest.dependencies['@murasakijs/ui'] = 'workspace:*'
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n')
          fs.writeFileSync('examples/mac-package-app/murasaki.config.ts', `import { defineConfig } from 'murasaki'

          export default defineConfig({
            appId: 'app.murasaki.ci.package',
            productName: 'Murasaki CI Package',
            version: '1.0.0',
            icon: 'src/assets/icon.png',
            locales: ['en'],
            window: { title: 'Murasaki package probe', width: 800, height: 600 },
          })
          `)
          NODE

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build framework packages
        run: |
          pnpm --filter @murasakijs/ui build
          pnpm --filter murasaki build

      - name: Build native binding and launcher
        working-directory: crates/native
        run: |
          pnpm exec napi build --platform --release
          cargo build --locked --release --bin murasaki-launcher

      - name: Build, bundle, and create the DMG
        working-directory: examples/mac-package-app
        run: |
          pnpm exec murasaki build
          pnpm exec murasaki bundle --target darwin-${{ matrix.arch }}
          pnpm exec murasaki installer --target darwin-${{ matrix.arch }} --no-build

      - name: Exercise install, first launch, update, and uninstall
        shell: bash
        run: >-
          bash .github/scripts/mac-installer-e2e.sh
          "examples/mac-package-app/dist/Murasaki CI Package-1.0.0.dmg"
          "examples/mac-package-app/dist/bundle/Murasaki CI Package.app"
          "${{ matrix.arch }}"
          "$RUNNER_TEMP/murasaki-mac-installer-e2e"
          120

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: macos-${{ matrix.arch }}-package-failure
          path: |
            ${{ runner.temp }}/murasaki-mac-installer-e2e/**
            examples/mac-package-app/dist/**
          if-no-files-found: warn
