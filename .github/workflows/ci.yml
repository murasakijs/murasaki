              const first = await mainWindows.create('probe')
              await mainWindows.destroy('probe')
              const second = await mainWindows.create('probe')
              const valid = first.label === 'probe'
                && second.label === 'probe'
                && second.generation > first.generation
                && second.visible === false
              if (!valid) return Response.json({ ok: false }, { status: 400 })
              primaryReady = true
              return Response.json({ ok: true, generation: second.generation }, { status: 202 })
            }

            const valid = primaryReady
              && body.stage === 'secondary'
              && body.label === 'probe'
              && JSON.stringify(body.labels) === JSON.stringify(['main', 'probe'])
              && body.denied === true
              && body.opened === true
            if (!valid) return Response.json({ ok: false }, { status: 400 })

            console.log(marker)
            return Response.json({ ok: true, marker })
          }
          `)
          NODE

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build framework packages
        run: |
          pnpm --filter @murasakijs/ui build
          pnpm --filter murasaki build

      - name: Test native crate
        working-directory: crates/native
        run: cargo test --locked

      - name: Build native Node binding
        working-directory: crates/native
        run: pnpm exec napi build --platform --release

      - name: Build production native launcher
        working-directory: crates/native
        run: cargo build --locked --release --bin murasaki-launcher

      - name: Build scaffolded app
        working-directory: examples/ci-win-app
        run: pnpm exec murasaki build

      - name: Bundle scaffolded app
        working-directory: examples/ci-win-app
        run: pnpm exec murasaki bundle --target win32-x64

      - name: Locate bundled executable
        id: bundle
        shell: pwsh
        run: |
          $exePath = Join-Path (Resolve-Path 'examples/ci-win-app/dist/bundle') 'Murasaki CI Windows/Murasaki CI Windows.exe'
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            Write-Error "Bundled application executable was not produced at the expected path: $exePath"
            exit 1
          }
          "exePath=$exePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Launch bundled app and verify backend
        shell: pwsh
        run: >-
          .github/scripts/win-smoke-test.ps1
          -ExePath "${{ steps.bundle.outputs.exePath }}"
          -TimeoutSeconds 60
          -ExpectedMarker "MURASAKI_MULTIWINDOW_OK=probe:main,probe:hidden-denied-opened"
          -ExpectBackendCrash

      - name: Generate ephemeral code-signing PFX
        shell: pwsh
        timeout-minutes: 2
        run: |
          # Generate the fixture entirely through .NET. This avoids the
          # interactive Windows certificate provider used by
          # New-SelfSignedCertificate and still exercises the release PFX path.
          $pfxPath = Join-Path $env:RUNNER_TEMP 'murasaki-ci-signing.pfx'
          $password = 'murasaki-ci-only'
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          try {
            $subject = [System.Security.Cryptography.X509Certificates.X500DistinguishedName]::new(
              'CN=Murasaki CI Authenticode'
            )
            $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
              $subject,
              $rsa,
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
                [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,
                $true
              )
            )
            $oids = [System.Security.Cryptography.OidCollection]::new()
            [void]$oids.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new(
                $oids,
                $false
              )
            )
            $certificate = $request.CreateSelfSigned(
              [System.DateTimeOffset]::UtcNow.AddMinutes(-5),
              [System.DateTimeOffset]::UtcNow.AddDays(2)
            )
            try {
              [System.IO.File]::WriteAllBytes(
                $pfxPath,
                $certificate.Export(
                  [System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,
                  $password
                )
              )
            } finally {
              $certificate.Dispose()
            }
          } finally {
            $rsa.Dispose()
          }
          "MURASAKI_WINDOWS_CERTIFICATE_FILE=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MURASAKI_WINDOWS_CERTIFICATE_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Keep PR CI independent of a public timestamp service. Unit tests
          # cover /tr + /td ordering; release users timestamp by default.
          'MURASAKI_WINDOWS_TIMESTAMP_URL=false' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # GitHub-hosted Windows blocks when a self-signed root is added to
          # the trust store. This opt-in is hard-restricted to CI + PFX and
          # verifies the Authenticode hash and exact signer instead of trust.
          'MURASAKI_WINDOWS_CI_ALLOW_UNTRUSTED_CERTIFICATE=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Windows installer toolchains
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          dotnet tool install --global wix --version 4.0.6
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install WiX UI extension
        shell: pwsh
        run: wix extension add -g WixToolset.UI.wixext/4.0.6

      - name: Build and Authenticode-sign portable, NSIS, and MSI artifacts
        working-directory: examples/ci-win-app
        run: pnpm exec murasaki installer --target win32-x64 --no-build --sign

      - name: Verify signed artifacts and signed app startup
        shell: pwsh
        run: |
          $expectedCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:MURASAKI_WINDOWS_CERTIFICATE_FILE,
            $env:MURASAKI_WINDOWS_CERTIFICATE_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          function Assert-CiAuthenticodeIntegrity {
            param([Parameter(Mandatory = $true)][string]$Path)
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            $status = [string]$signature.Status
            if ($null -eq $signature.SignerCertificate) {
              throw "No embedded Authenticode signer on $Path"
            }
            if (@('Valid', 'NotTrusted', 'UnknownError') -notcontains $status) {
              throw "Authenticode integrity check failed on $Path`: $status $($signature.StatusMessage)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $expectedCertificate.Thumbprint) {
              throw "Unexpected Authenticode signer on $Path"
            }
          }

          $app = (Resolve-Path 'examples/ci-win-app/dist/bundle/Murasaki CI Windows/Murasaki CI Windows.exe').Path
          $setup = (Resolve-Path 'examples/ci-win-app/dist/Murasaki CI Windows-0.0.0-setup-x64.exe').Path
          $msi = (Resolve-Path 'examples/ci-win-app/dist/Murasaki CI Windows-0.0.0.msi').Path
          @($app, $setup, $msi) | ForEach-Object { Assert-CiAuthenticodeIntegrity -Path $_ }

          $zip = (Resolve-Path 'examples/ci-win-app/dist/bundle/Murasaki CI Windows-win32-x64.zip').Path
          $expanded = Join-Path $env:RUNNER_TEMP 'murasaki-signed-portable'
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
          $portableExe = Join-Path $expanded 'Murasaki CI Windows/Murasaki CI Windows.exe'
          Assert-CiAuthenticodeIntegrity -Path $portableExe
          $expectedCertificate.Dispose()

          .github/scripts/win-smoke-test.ps1 `
            -ExePath $app `
            -TimeoutSeconds 60 `
            -ExpectedMarker 'MURASAKI_MULTIWINDOW_OK=probe:main,probe:hidden-denied-opened' `
            -ExpectBackendCrash

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-x64-bundle-failure
          path: examples/ci-win-app/dist/bundle/**
          if-no-files-found: warn
