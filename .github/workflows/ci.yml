                  after = await windows.list()
                }
                const probe = after.find((window) => window.label === 'probe')
                if (!probe || probe.visible) throw new Error('recreated probe is not hidden')
                await windows.open('probe')
              })().catch((error) => console.error('MURASAKI_MULTIWINDOW_PRIMARY_FAIL', error))
            }, [])

            return <main>Primary multi-window probe</main>
          }
          `)

          fs.mkdirSync('examples/ci-win-app/src/app/probe', { recursive: true })
          fs.writeFileSync('examples/ci-win-app/src/app/probe/page.tsx', `'use client'

          import { useEffect } from 'react'
          import { appWindow, windows } from 'murasaki/native'

          let started = false

          export default function MultiWindowProbe() {
            useEffect(() => {
              if (started) return
