name: Native prebuild + publish

on:
  push:
    tags:
      - 'native-v*'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            target: aarch64-apple-darwin
          - host: macos-13
            target: x86_64-apple-darwin
          - host: windows-2022
            target: x86_64-pc-windows-msvc
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.host }}
    name: build (${{ matrix.target }})
    defaults:
      run:
        working-directory: crates/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install linux deps
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: pnpm install
        run: pnpm install --ignore-workspace
      - name: build
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/native/*.node
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: crates/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # OIDC trusted publishing: no NODE_AUTH_TOKEN needed. npm reads the
          # GitHub Actions OIDC token itself via the id-token: write permission.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # OIDC trusted publishing requires npm 11.5+. Node 24 ships a recent
      # npm, but force-upgrading guarantees we get a CLI that supports it.
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: pnpm install
        run: pnpm install --ignore-workspace

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/native-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::crates/native package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

      # @murasakijs/native ships as a single package containing the .node
      # binary for every target (files: ["index.js", "index.d.ts", "*.node"]).
      # The napi-generated index.js loader tries each ./murasaki-native.<triple>.node
      # locally before falling back to optionalDependencies, so bundling all
      # of them here means no per-target packages or optionalDependencies are
      # needed.
      - uses: actions/download-artifact@v4
        with:
          path: crates/native
          merge-multiple: true

      - name: Verify all 5 target binaries are present
        run: |
          NODE_COUNT=$(find . -maxdepth 1 -name '*.node' | wc -l | tr -d ' ')
          if [ "$NODE_COUNT" != "5" ]; then
            echo "::error::Expected 5 .node binaries (one per build matrix target), found $NODE_COUNT"
            ls -la ./*.node 2>/dev/null || true
            exit 1
          fi
          echo "Found 5 .node binaries:"
          ls -la ./*.node

      - name: Publish @murasakijs/native
        run: npm publish --access public --provenance
