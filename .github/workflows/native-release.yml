name: Native prebuild + publish

on:
  push:
    tags:
      - 'native-v*'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            target: aarch64-apple-darwin
          - host: macos-13
            target: x86_64-apple-darwin
          - host: windows-2022
            target: x86_64-pc-windows-msvc
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.host }}
    name: build (${{ matrix.target }})
    defaults:
      run:
        working-directory: crates/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install linux deps
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: pnpm install
        run: pnpm install --ignore-workspace
      - name: build
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/native/*.node
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: crates/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: pnpm install
        run: pnpm install --ignore-workspace
      - uses: actions/download-artifact@v4
        with:
          path: crates/native/artifacts
      - run: pnpm exec napi artifacts
      - run: pnpm exec napi create-npm-dirs
      - run: pnpm publish --provenance --access public --no-git-checks
