name: Native prebuild + publish

on:
  push:
    tags:
      - 'native-v*'

permissions:
  contents: read
  checks: read
  id-token: write

jobs:
  validate:
    name: Validate native release commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Verify tag and main ancestry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-commit.mjs --require-ci native-v crates/native/package.json
      - name: Verify native version is unpublished and increasing
        run: node scripts/verify-publishable-versions.mjs crates/native

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            target: aarch64-apple-darwin
          # Cross-compile the Intel target on an ARM mac runner: macos-13
          # (Intel) runners are scarce/being retired, and Apple's toolchain is
          # universal so a macos-14 host builds x86_64 fine.
          - host: macos-14
            target: x86_64-apple-darwin
          - host: windows-2022
            target: x86_64-pc-windows-msvc
          # Native arm64 build — windows-11-arm is a GitHub-hosted runner
          # (free for public repos), so this builds natively rather than
          # cross-compiling (unlike the macos-14 Intel entry above, whose
          # host is a different arch than its target).
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.host }}
    name: build (${{ matrix.target }})
    defaults:
      run:
        working-directory: crates/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # No version pin: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 reads it from the root
      # package.json "packageManager" field (specifying both errors).
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Install linux deps
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - name: pnpm install
        run: pnpm --dir ../.. install --frozen-lockfile
      - name: build
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }}
      - name: build launcher
        run: cargo build --locked --release --bin murasaki-launcher --target ${{ matrix.target }}
      - name: package launcher binary
        # Named to match the napi `.node` triple convention
        # (murasaki-native.<triple>.node → murasaki-launcher.<triple>) so
        # bundle.ts can find both with the same triple string — see
        # packages/murasaki/src/cli/bundle.ts's resolveLauncherBinary(). The
        # triple is read off the just-built `.node` file rather than mapped
        # from matrix.target by hand, so it can't drift from what napi
        # actually names things. Runs under bash even on the Windows runner
        # (Git Bash, ships on windows-2022) for a single cross-platform step.
        shell: bash
        run: |
          NODE_FILE=$(ls murasaki-native.*.node)
          TRIPLE=${NODE_FILE#murasaki-native.}
          TRIPLE=${TRIPLE%.node}
          TARGET='${{ matrix.target }}'
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/murasaki-launcher.exe" "murasaki-launcher.$TRIPLE.exe"
          else
            cp "target/$TARGET/release/murasaki-launcher" "murasaki-launcher.$TRIPLE"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: |
            crates/native/*.node
            crates/native/murasaki-launcher.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: crates/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # OIDC trusted publishing: no NODE_AUTH_TOKEN needed. npm reads the
          # GitHub Actions OIDC token itself via the id-token: write permission.
      # No version pin: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 reads it from the root
      # package.json "packageManager" field (specifying both errors).
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      # OIDC trusted publishing requires npm 11.5+. Node 24 ships a recent
      # npm, but force-upgrading guarantees we get a CLI that supports it.
      - name: Upgrade npm to latest
        run: npm install -g npm@11.5.2

      - name: pnpm install
        run: pnpm --dir ../.. install --frozen-lockfile

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/native-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::crates/native package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

      # @murasakijs/native ships as a single package containing the .node
      # binary for every target (files: ["index.js", "index.d.ts", "*.node"])
      # plus the murasaki-launcher binary for every target
      # (files: [..., "murasaki-launcher.*"]). The napi-generated index.js
      # loader tries each ./murasaki-native.<triple>.node locally before
      # falling back to optionalDependencies, so bundling all of them here
      # means no per-target packages or optionalDependencies are needed;
      # murasaki-launcher.<triple> is resolved the same way by
      # packages/murasaki/src/cli/bundle.ts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: crates/native
          merge-multiple: true

      - name: Verify all 6 target binaries are present
        run: |
          NODE_COUNT=$(find . -maxdepth 1 -name '*.node' | wc -l | tr -d ' ')
          if [ "$NODE_COUNT" != "6" ]; then
            echo "::error::Expected 6 .node binaries (one per build matrix target), found $NODE_COUNT"
            ls -la ./*.node 2>/dev/null || true
            exit 1
          fi
          echo "Found 6 .node binaries:"
          ls -la ./*.node

          LAUNCHER_COUNT=$(find . -maxdepth 1 -name 'murasaki-launcher.*' | wc -l | tr -d ' ')
          if [ "$LAUNCHER_COUNT" != "6" ]; then
            echo "::error::Expected 6 murasaki-launcher binaries (one per build matrix target), found $LAUNCHER_COUNT"
            ls -la ./murasaki-launcher.* 2>/dev/null || true
            exit 1
          fi
          echo "Found 6 murasaki-launcher binaries:"
          ls -la ./murasaki-launcher.*

      - name: Inspect exact native npm payload
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/native-pack.json"
          PACK_JSON="$RUNNER_TEMP/native-pack.json" node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.env.PACK_JSON, 'utf8'))[0]
          const files = report.files.map((entry) => entry.path)
          const nodes = files.filter((file) => /^murasaki-native\..+\.node$/.test(file))
          const launchers = files.filter((file) => /^murasaki-launcher\./.test(file))
          if (nodes.length !== 6 || launchers.length !== 6) {
            throw new Error(`native payload requires 6 bindings and 6 launchers; got ${nodes.length} and ${launchers.length}`)
          }
          if (!files.includes('index.js') || !files.includes('index.d.ts') || !files.includes('package.json')) {
            throw new Error('native payload is missing its loader, declarations, or manifest')
          }
          console.log(`native payload verified: ${files.length} files, ${report.size} bytes`)
          NODE

      - name: Publish @murasakijs/native
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@murasakijs/native@$V" version >/dev/null 2>&1; then
            EXISTING_HEAD=$(npm view "@murasakijs/native@$V" gitHead)
            if [ "$EXISTING_HEAD" != "$GITHUB_SHA" ]; then
              echo "::error::@murasakijs/native@$V already exists from a different commit ($EXISTING_HEAD)"
              exit 1
            fi
            echo "@murasakijs/native@$V already published from this commit — verifying it."
          else
            npm publish --access public --provenance
          fi

      - name: Verify registry publication and provenance
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="@murasakijs/native"
          for attempt in {1..12}; do
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "::error::$NAME@$VERSION did not become visible in the registry"
              exit 1
            fi
            sleep 5
          done

          test -n "$(npm view "$NAME@$VERSION" dist.integrity)"
          test "$(npm view "$NAME@$VERSION" gitHead)" = "$GITHUB_SHA"
          PREDICATE=$(npm view "$NAME@$VERSION" dist.attestations.provenance.predicateType)
          test "$PREDICATE" = 'https://slsa.dev/provenance/v1'
