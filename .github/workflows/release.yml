name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version to publish (defaults to package.json)'
        required: false

# Permissions needed for OIDC trusted publishing + provenance attestation
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish murasaki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          # Trusted Publishing reads OIDC; no NODE_AUTH_TOKEN needed

      - name: Install dependencies
        # Not --frozen-lockfile because the committed pnpm-lock.yaml was
        # generated inside the workspace root and references sibling packages
        # that don't exist here. Standard install is enough for CI.
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify version matches tag (if triggered by tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

      - name: Publish to npm
        run: npm publish --provenance --access public
