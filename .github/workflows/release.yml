name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version to publish (defaults to package.json)'
        required: false

# Permissions needed for OIDC Trusted Publishing (id-token) + checkout (contents).
# No NPM_TOKEN is used: npm publish authenticates via the GitHub Actions OIDC
# token exchanged for a short-lived npm token at publish time.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish murasaki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here: pnpm/action-setup@v4 reads the version from the
      # root package.json "packageManager" field. Specifying both errors with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # OIDC Trusted Publishing requires npm 11.5+. Even though Node 24 ships a
      # recent npm, force-upgrading guarantees we get a CLI that supports it.
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        # Not --frozen-lockfile because the committed pnpm-lock.yaml was
        # generated inside the workspace root and references sibling packages
        # that don't exist here. Standard install is enough for CI.
        run: pnpm install --no-frozen-lockfile

      # @murasakijs/ui ships its own compiled dist (plus styles.css /
      # tailwind-preset.cjs at the package root). It versions independently of
      # the framework, so it is NOT part of the tag-match check below.
      #
      # Built BEFORE murasaki, not after: murasaki imports @murasakijs/ui (see
      # react/update-button.tsx), so its tsc run needs ui's emitted .d.ts to
      # already exist. With the old order the build failed on "Cannot find
      # module '@murasakijs/ui'" the first time a release carried the updater.
      - name: Build @murasakijs/ui
        run: pnpm --filter @murasakijs/ui build

      - name: Build murasaki
        run: pnpm --filter murasaki build

      # npm always ships README.md from the package dir (regardless of `files`),
      # so copy the root README into each package before publishing — otherwise
      # the npmjs.com pages for murasaki/create-murasaki are blank. Single source
      # of truth stays the root README; this is CI-only (not committed).
      - name: Stage README for npm pages
        run: |
          cp README.md packages/murasaki/README.md
          cp README.md packages/create-murasaki/README.md

      - name: Verify package versions match tag (if triggered by tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          for pkg in packages/murasaki packages/create-murasaki; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$pkg version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
              exit 1
            fi
            echo "$pkg version OK: $PKG_VERSION"
          done

      # `npm publish` (unlike `pnpm publish`) ships `workspace:` specs verbatim,
      # and "workspace:^" is not a version anyone can install. Rewrite them to
      # the versions they resolve to — across every published manifest and every
      # dependency field, preserving each workspace operator's meaning — and fail
      # the release if any survive. See the script for the full rationale.
      #
      # CI-only: the committed manifests keep their workspace: specs so the
      # monorepo's local links keep working.
      - name: "Resolve workspace: dependencies to real versions"
        run: node scripts/resolve-workspace-deps.mjs

      # Keep the scaffolder template in sync with the release. create-murasaki's
      # default template pins `murasaki` in its package.json, and for a 0.x
      # release the caret range is minor-locked (`^0.26.0` EXCLUDES 0.27.0). So
      # without this, a fresh `npm create murasaki` would pull an older murasaki
      # than the one being published. Rewrite it to `^<version>` (CI-only) so new
      # apps always get the murasaki shipped with this create-murasaki.
      - name: Sync scaffolder template murasaki dependency
        run: |
          V=$(node -p "require('./packages/create-murasaki/package.json').version")
          node -e "
          const fs = require('fs');
          const f = 'packages/create-murasaki/templates/default/package.json';
          const p = JSON.parse(fs.readFileSync(f, 'utf8'));
          p.dependencies.murasaki = '^' + '$V';
          fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
          "
          echo "Template murasaki dep → $(node -p "require('./packages/create-murasaki/templates/default/package.json').dependencies.murasaki")"

      # The default template also depends on @murasakijs/ui, which versions
      # independently. Pin the template to the @murasakijs/ui version shipped in
      # this monorepo (`^<packages/ui version>`) so a fresh `npm create murasaki`
      # always pulls the UI library that matches this release. CI-only, like the
      # murasaki sync above.
      - name: Sync scaffolder template @murasakijs/ui dependency
        run: |
          UI_VERSION=$(node -p "require('./packages/ui/package.json').version")
          node -e "
          const fs = require('fs');
          const f = 'packages/create-murasaki/templates/default/package.json';
          const p = JSON.parse(fs.readFileSync(f, 'utf8'));
          p.dependencies['@murasakijs/ui'] = '^' + '$UI_VERSION';
          fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
          "
          echo "Template @murasakijs/ui dep → $(node -p "require('./packages/create-murasaki/templates/default/package.json').dependencies['@murasakijs/ui']")"

      # Ordering guard: murasaki depends on @murasakijs/native, which is
      # published separately by native-release.yml on its own native-v<x.y.z>
      # tag. If that tag wasn't pushed (or its run hasn't finished) before this
      # framework release, murasaki would publish with a dependency users can't
      # install yet. Fail early instead of shipping a broken release.
      - name: Verify @murasakijs/native is already published
        run: |
          NATIVE_VERSION=$(node -p "require('./crates/native/package.json').version")
          if [ "$(npm view "@murasakijs/native@${NATIVE_VERSION}" version 2>/dev/null)" != "$NATIVE_VERSION" ]; then
            echo "::error::@murasakijs/native@${NATIVE_VERSION} is not on npm yet. Push the native-v${NATIVE_VERSION} tag and let native-release.yml finish before releasing the framework."
            exit 1
          fi
          echo "@murasakijs/native@${NATIVE_VERSION} is published — OK to release the framework."

      # @murasakijs/native itself is published separately by native-release.yml.
      # Each publish is idempotent: skip if that exact version is already on
      # npm, so re-running after a partial failure (e.g. only one package
      # published) doesn't error on the already-published one.
      #
      # @murasakijs/ui versions independently of the framework and publishes at
      # its own package.json version. It goes FIRST: both murasaki (since the
      # updater's <UpdateButton />) and the scaffolder template depend on it, so
      # neither may be published pointing at a ui version that isn't on npm yet.
      # The very first version had to be published manually and its Trusted
      # Publisher configured on npm before CI could OIDC-publish subsequent
      # versions; until a new one is cut this step simply skips 0.1.0.
      - name: Publish packages/ui
        working-directory: packages/ui
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@murasakijs/ui@$V" version >/dev/null 2>&1; then
            echo "@murasakijs/ui@$V already published — skipping."
          else
            npm publish --provenance --access public
          fi

      # Ordering guard, same shape as the @murasakijs/native one above: murasaki
      # now declares a real dependency on @murasakijs/ui, so refuse to publish it
      # against a ui version npm can't serve yet.
      - name: Verify @murasakijs/ui is published
        run: |
          UI_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [ "$(npm view "@murasakijs/ui@${UI_VERSION}" version 2>/dev/null)" != "$UI_VERSION" ]; then
            echo "::error::@murasakijs/ui@${UI_VERSION} is not on npm. murasaki depends on it, so publishing now would ship an uninstallable package."
            exit 1
          fi
          echo "@murasakijs/ui@${UI_VERSION} is published — OK to publish murasaki."

      - name: Publish packages/murasaki
        working-directory: packages/murasaki
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "murasaki@$V" version >/dev/null 2>&1; then
            echo "murasaki@$V already published — skipping."
          else
            npm publish --provenance --access public
          fi

      # Ordering guard: the scaffolder template depends on @murasakijs/ui, so a
      # fresh `npm create murasaki` will `npm install` it. Refuse to publish
      # create-murasaki unless the exact @murasakijs/ui version the template
      # pins is already on npm — otherwise scaffolded apps would fail to install.
      # (Covers the first-publish/Trusted-Publisher-not-yet-configured case,
      # where the publish step above can't OIDC-publish a brand-new version.)
      - name: Verify @murasakijs/ui (template dependency) is published
        run: |
          UI_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [ "$(npm view "@murasakijs/ui@${UI_VERSION}" version 2>/dev/null)" != "$UI_VERSION" ]; then
            echo "::error::@murasakijs/ui@${UI_VERSION} is not on npm yet. Publish it (manually for the first version, then configure its Trusted Publisher) before releasing create-murasaki, or scaffolded apps will fail to install."
            exit 1
          fi
          echo "@murasakijs/ui@${UI_VERSION} is published — OK to release create-murasaki."

      - name: Publish packages/create-murasaki
        working-directory: packages/create-murasaki
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "create-murasaki@$V" version >/dev/null 2>&1; then
            echo "create-murasaki@$V already published — skipping."
          else
            npm publish --provenance --access public
          fi
