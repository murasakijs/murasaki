# Deploys the docs site (apps/docs) as a static export to GitHub Pages.
#
# One-time setup: in the repo's Settings ▸ Pages, set Source to
# "GitHub Actions". A custom domain (e.g. murasaki.dev) can also be
# configured there — apps/docs is built without a `basePath`, so it expects
# to be served from the root of a domain.
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here: pnpm/action-setup@v4 reads the version from the
      # root package.json "packageManager" field. Specifying both errors with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install

      - name: Build docs
        run: pnpm --filter murasaki-docs build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
