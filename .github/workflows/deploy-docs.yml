# Builds the docs site (apps/docs) as a static export and publishes it to the
# org-page repo `murasakijs/murasakijs.github.io`, which GitHub Pages serves at
# the ROOT of https://murasakijs.github.io/ — so no `basePath` is needed (a
# project sub-path deploy would serve broken assets).
#
# One-time setup (done once, by a maintainer):
#   1. Create a PUBLIC repo `murasakijs/murasakijs.github.io` (empty is fine).
#      GitHub Pages auto-serves such repos from the default branch at the root.
#   2. Create a fine-grained Personal Access Token with `Contents: write` on
#      that repo, and add it to THIS repo as an Actions secret named
#      `DOCS_DEPLOY_TOKEN` (Settings ▸ Secrets and variables ▸ Actions).
#   3. (Optional) Connect the `murasaki.dev` custom domain on the
#      murasakijs.github.io repo's Settings ▸ Pages, and uncomment `cname:` below.
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'README.md'
  workflow_dispatch:

# Only the checkout needs repo access here; the cross-repo push authenticates
# with DOCS_DEPLOY_TOKEN, not the workflow's GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin: pnpm/action-setup@v4 reads it from the root
      # package.json "packageManager" field (specifying both errors).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install

      - name: Build docs (static export -> apps/docs/out)
        run: pnpm --filter murasaki-docs build

      - name: Publish to murasakijs.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          external_repository: murasakijs/murasakijs.github.io
          publish_branch: main
          publish_dir: ./apps/docs/out
          # cname: murasaki.dev   # uncomment once the custom domain is connected
