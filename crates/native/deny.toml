# cargo-deny configuration for the murasaki-native crate.
#
# Install with `cargo install cargo-deny --locked`, then run locally with
# `cargo deny check --warn unmaintained`.
# (from crates/native). CI runs this via EmbarkStudios/cargo-deny-action in
# .github/workflows/security.yml.
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
#
# Vulnerabilities are always denied by cargo-deny 0.20 (no config toggle);
# `ignore` is intentionally empty: known vulnerabilities must fail CI.
#
# `unmaintained` no longer has an in-config lint level in this cargo-deny
# version (the old `unmaintained = "warn"` key was removed upstream) — it is
# downgraded to a warning via the `-W unmaintained` CLI flag passed in
# .github/workflows/security.yml instead, so this file just leaves the
# default scope (`all`) in place.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
ignore = []

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# Every SPDX identifier below is actually present somewhere in the crate's
# resolved dependency graph (`cargo deny check licenses`, iterated locally
# until green). murasaki-native itself is MIT (see Cargo.toml).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false

# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
