[package]
name = "murasaki-native"
version = "0.26.0"
edition = "2021"
license = "MIT"
description = "Native binding for murasaki (Rust wry + tao + muda), exposed to Node via napi-rs"
authors = ["ichi"]

[lib]
crate-type = ["cdylib", "rlib"]

# Rust binary that becomes the packaged app's CFBundleExecutable (Tauri-style),
# replacing the bash-script + `node` prod launcher — see src/launcher.rs.
# Links the rlib above so it can reuse Application/BrowserWindow/Webview/menu
# internals directly instead of duplicating them.
[[bin]]
name = "murasaki-launcher"
path = "src/bin/murasaki-launcher.rs"

[dependencies]
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GUI stack (skipped on freebsd/android)
[target.'cfg(not(any(target_os = "freebsd", target_os = "android")))'.dependencies]
tao = { version = "0.35", features = ["rwh_06"] }
wry = { version = "0.55", features = ["devtools"] }
muda = "0.19"
rfd = "0.15"
tray-icon = "0.24"
arboard = "3"
notify-rust = "4"
open = "5"
png = "0.17"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSVisualEffectView", "NSView", "NSWindow", "NSImage"] }
objc2-foundation = "0.3"

# Windows Job Object (src/launcher.rs's KillOnCloseJob) — kills the spawned
# node.exe child when the launcher process exits for any reason, including a
# crash, since Windows has no ppid-reparenting orphan signal to fall back on
# (unlike macOS/Linux — see prod-server.mjs's `ppid === 1` check).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
