[package]
name = "murasaki-native"
version = "0.43.0"
edition = "2021"
license = "MIT"
description = "Native binding for murasaki (Rust wry + tao + muda), exposed to Node via napi-rs"
authors = ["ichi"]

[lib]
crate-type = ["cdylib", "rlib"]

# Rust binary that becomes the packaged app's CFBundleExecutable (Tauri-style),
# replacing the bash-script + `node` prod launcher — see src/launcher.rs.
# Links the rlib above so it can reuse Application/BrowserWindow/Webview/menu
# internals directly instead of duplicating them.
[[bin]]
name = "murasaki-launcher"
path = "src/bin/murasaki-launcher.rs"

[features]
# Exposes the fuzz-only parse entry points in src/capability_policy.rs and
# src/updater.rs (see crates/native/fuzz). Never enabled for the published
# crate or the napi build.
fuzzing = []

[dependencies]
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `--apply-update` payload re-verification (crates/native/src/updater.rs) —
# unconditional (not GUI-stack/platform gated) since it's pure Rust with no
# native deps of its own.
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
fs2 = "0.4"

# GUI stack (skipped on freebsd/android)
[target.'cfg(not(any(target_os = "freebsd", target_os = "android")))'.dependencies]
tao = { version = "0.35", features = ["rwh_06"] }
wry = { version = "0.55", features = ["devtools", "mac-proxy"] }
muda = "0.19"
rfd = "0.15"
tray-icon = "0.24"
arboard = "3"
notify-rust = "4"
open = "5"
png = "0.17"
url = "2"
# clipboard.readImage/writeImage's PNG<->base64 wire encoding (see clipboard.rs).
base64 = "0.22"
# shell.trashItem — moves a file/directory to the OS trash/recycle bin.
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.8"
window-vibrancy = "0.6"
security-framework = "3.7"
security-framework-sys = "2.17"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSVisualEffectView", "NSView", "NSWindow", "NSImage", "NSWorkspace"] }
objc2-foundation = "0.3"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "AXUIElement", "HIServices"] }
# system_permission.rs's "location" kind — CLLocationManager.authorizationStatus
# plus requestWhenInUseAuthorization/requestAlwaysAuthorization. No delegate,
# no location fix: consent state only, so the default feature set (which pulls
# in CLGeocoder, CLBeaconRegion, dispatch2, objc2-contacts, …) is skipped.
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocationManager"] }
# system_permission.rs's "photos" kind — PHPhotoLibrary.authorizationStatusForAccessLevel:/
# requestAuthorizationForAccessLevel:handler: (the `.readWrite` access level).
objc2-photos = { version = "0.3", default-features = false, features = ["std", "PHPhotoLibrary", "block2"] }
# system_permission.rs's "contacts" kind — CNContactStore.authorizationStatusForEntityType:/
# requestAccessForEntityType:completionHandler:.
objc2-contacts = { version = "0.3", default-features = false, features = ["std", "CNContactStore", "block2"] }
# system_permission.rs's "calendar"/"reminders" kinds — EKEventStore.authorizationStatusForEntityType:
# plus the macOS 14+ requestFullAccessTo{Events,Reminders}WithCompletion: (falling
# back to the deprecated requestAccessToEntityType:completion: pre-14, checked at
# runtime via NSProcessInfo since LSMinimumSystemVersion is 11.0).
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "EKTypes", "EKEventStore", "block2"] }
# system_permission.rs's "speechRecognition" kind — SFSpeechRecognizer.authorizationStatus/
# requestAuthorization:.
objc2-speech = { version = "0.3", default-features = false, features = ["std", "SFSpeechRecognizer", "block2"] }
# system_permission.rs's "bluetooth" kind — CBManager.authorization (a class
# property, readable without a live manager) for status, and instantiating a
# delegate-less CBCentralManager (like CLLocationManager's no-delegate pattern
# above) to trigger the OS's own permission prompt for request.
objc2-core-bluetooth = { version = "0.3", default-features = false, features = ["std", "CBManager", "CBCentralManager"] }
# `--apply-update`'s `--wait-pid` liveness check (updater.rs) — `libc::kill(pid, 0)`.
libc = "0.2"

# Windows Job Object (src/launcher.rs's KillOnCloseJob) — kills the spawned
# node.exe child when the launcher process exits for any reason, including a
# crash, since Windows has no ppid-reparenting orphan signal to fall back on
# (unlike macOS/Linux — see prod-server.mjs's `ppid === 1` check).
[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey = "0.8"
windows-registry = "0.6"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

# Linux native parity (RFC 0002 phase L1):
#  - global-hotkey: same crate as macOS/Windows above, X11-only upstream (see
#    global_shortcut.rs's Wayland detection — XWayland works, pure Wayland
#    sessions get a structured `unsupported` error instead of registering
#    against a nonexistent X server).
#  - gtk: muda/tao/tray-icon already depend on it (default `gtk` feature) for
#    their own GTK backends; declared directly here too so this crate's own
#    code (menu.rs's `attach_menu_bar`, webview.rs's context-menu/app-menu
#    Linux paths) can name `gtk`/`tao::platform::unix` types without relying
#    on a transitive re-export.
#  - secret-service: zbus-based (pure Rust, no libsecret/glib-sys linkage)
#    Secret Service client for secure_storage.rs's Linux backend. `rt-async-io`
#    picks zbus's bundled async-io reactor (no external Tokio runtime needed
#    from this synchronous napi addon); `crypto-rust` avoids an OpenSSL
#    dependency, matching macOS/Windows' no-OpenSSL native crypto.
#  - libc: `--apply-update`'s `--wait-pid` liveness check (updater.rs) —
#    `libc::kill(pid, 0)`, same as macOS above — and `launcher.rs`'s
#    process-group teardown of the bundled Node backend tree (`imp_linux`'s
#    `terminate_and_wait_child`).
[target.'cfg(target_os = "linux")'.dependencies]
global-hotkey = "0.8"
gtk = "0.18"
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }
libc = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1

# wayland-scanner 0.31.10's published manifest selects vulnerable quick-xml
# 0.39.x. The upstream fix landed after unreleased breaking Wayland API changes,
# so pinning that repository revision makes released consumers such as ashpd
# fail to compile. Keep the released scanner source/API in this small vendored
# copy and change only its parser dependency to the fixed quick-xml 0.41 line.
#
# wry 0.55.1's `Drop for X11Data` (webkitgtk backend) unconditionally
# XDestroyWindow()s + closes `x11_window`/`gtk_window`, which for every
# webview Murasaki builds (the non-child embedding path) alias the PARENT
# tao window rather than a wry-owned one. That races tao's own window
# teardown into an X11 BadWindow that GDK's error handler turns into an
# immediate `_exit(1)` — no panic, no crash report. Still present on wry's
# `dev` branch and 0.55.1 is the latest release, so it can't be fixed by
# upgrading. Vendor 0.55.1 unmodified except for guarding that Drop on
# `is_child`, matching every other method in the same file. See
# vendor/wry/PATCH.md for details.
[patch.crates-io]
wayland-scanner = { path = "vendor/wayland-scanner" }
wry = { path = "vendor/wry" }
